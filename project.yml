name: Taskfold
options:
  bundleIdPrefix: com.xrw
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: false
    # Mac App Store 分发：自动签名。⚠️ 替换为你的 10 位 Team ID 后 make project
    # （developer.apple.com → Membership 详情页；CI 与无账号本地构建用
    #   make xbuild XCODEBUILD_ARGS='CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM=' 走 Ad-hoc）
    DEVELOPMENT_TEAM: "XXXXXXXXXX"
packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: 7.11.1
targets:
  Taskfold:
    type: application
    platform: macOS
    sources:
      # Help.md 显式声明进 Resources 构建阶段：xcodegen 对 .md 无默认 build phase，
      # 不声明不会拷入 .app（拷入后平铺在 Contents/Resources 根，与 SPM 的子目录路径差异由 HelpView 双路径探测兜底）
      - path: Sources/Taskfold
        excludes:
          - Resources/Help.md
      - path: Sources/Taskfold/Resources/Help.md
        buildPhase: resources
    dependencies:
      - target: TaskfoldKit
    info:
      path: Sources/Taskfold/Info.plist
      properties:
        CFBundleDisplayName: Taskfold
        # 版本统一走 build settings，避免与本文件 MARKETING_VERSION 双处硬编码漂移
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleIconName: AppIcon
        LSMinimumSystemVersion: "14.0"
        LSApplicationCategoryType: public.app-category.productivity
        NSHighResolutionCapable: true
        NSSupportsAutomaticGraphicsSwitching: true
        # 无网络无加密：App Store Connect 出口合规自动豁免，免填问卷
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xrw.Taskfold
        PRODUCT_NAME: Taskfold
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # App Store 上架：App Sandbox（见 Taskfold.entitlements），自动签名——
        # 日常构建 Apple Development，归档导出（make archive/export）自动重签 Apple Distribution
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Sources/Taskfold/Taskfold.entitlements
        COMBINE_HIDPI_IMAGES: true
  TaskfoldKit:
    type: framework
    platform: macOS
    sources:
      - Sources/TaskfoldKit
    dependencies:
      - package: GRDB
    info:
      path: Sources/TaskfoldKit/Info.plist
      properties: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xrw.TaskfoldKit
        DEFINES_MODULE: true
  Bench:
    type: tool
    platform: macOS
    sources:
      - Sources/Bench
    dependencies:
      - target: TaskfoldKit
      - package: GRDB
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xrw.Bench
  TaskfoldKitTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/TaskfoldKitTests
    dependencies:
      - target: TaskfoldKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xrw.TaskfoldKitTests
        GENERATE_INFOPLIST_FILE: true
schemes:
  Taskfold:
    build:
      targets:
        Taskfold: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - TaskfoldKitTests
    archive:
      config: Release
  Bench:
    build:
      targets:
        Bench: all
    run:
      config: Release
