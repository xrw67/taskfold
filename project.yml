name: Taskfold
options:
  bundleIdPrefix: com.xrw
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: false
packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: 7.11.1
targets:
  Taskfold:
    type: application
    platform: macOS
    sources:
      # Help.md 显式声明进 Resources 构建阶段：xcodegen 对 .md 无默认 build phase，
      # 不声明不会拷入 .app（拷入后平铺在 Contents/Resources 根，与 SPM 的子目录路径差异由 HelpView 双路径探测兜底）
      - path: Sources/Taskfold
        excludes:
          - Resources/Help.md
      - path: Sources/Taskfold/Resources/Help.md
        buildPhase: resources
    dependencies:
      - target: TaskfoldKit
    info:
      path: Sources/Taskfold/Info.plist
      properties:
        CFBundleDisplayName: Taskfold
        CFBundleShortVersionString: "0.1.0"
        CFBundleIconName: AppIcon
        LSMinimumSystemVersion: "14.0"
        LSApplicationCategoryType: public.app-category.productivity
        NSHighResolutionCapable: true
        NSSupportsAutomaticGraphicsSwitching: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xrw.Taskfold
        PRODUCT_NAME: Taskfold
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # 本地分发：Ad-hoc 签名即可运行，无需开发者账号
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        COMBINE_HIDPI_IMAGES: true
  TaskfoldKit:
    type: framework
    platform: macOS
    sources:
      - Sources/TaskfoldKit
    dependencies:
      - package: GRDB
    info:
      path: Sources/TaskfoldKit/Info.plist
      properties: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xrw.TaskfoldKit
        DEFINES_MODULE: true
  Bench:
    type: tool
    platform: macOS
    sources:
      - Sources/Bench
    dependencies:
      - target: TaskfoldKit
      - package: GRDB
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xrw.Bench
  TaskfoldKitTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/TaskfoldKitTests
    dependencies:
      - target: TaskfoldKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xrw.TaskfoldKitTests
        GENERATE_INFOPLIST_FILE: true
schemes:
  Taskfold:
    build:
      targets:
        Taskfold: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - TaskfoldKitTests
    archive:
      config: Release
  Bench:
    build:
      targets:
        Bench: all
    run:
      config: Release
